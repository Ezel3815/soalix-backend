name: Backend CI (Mosaic verification)

# Manual only. Deliberately NOT triggered on push/PR, so it never runs
# unintended and never risks touching anything automatically.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Fresh, disposable MySQL container. It exists only for this job, on the
    # runner's private network, and is destroyed when the job ends. It is not
    # reachable from outside this job and has no route to Render at all.
    # Credentials below are throwaway CI-only values, not real secrets.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mosaic_ci_test
          MYSQL_USER: ciuser
          MYSQL_PASSWORD: ciuserpass
          MYSQL_ROOT_PASSWORD: cirootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uciuser -pciuserpass"
          --health-interval=5s --health-timeout=5s --health-retries=15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Show test database target (no password printed)
        run: echo "Mosaic CI test DB -> host=127.0.0.1 port=3306 database=mosaic_ci_test user=ciuser"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the TEMPORARY test database only
        env:
          DATABASE_URL: mysql://ciuser:ciuserpass@127.0.0.1:3306/mosaic_ci_test
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Mosaic unit / engine / config / timezone tests (no DB)
        run: npx jest src/mosaic/mosaic.config.spec.ts src/mosaic/mosaic.time.spec.ts src/mosaic/mosaic.engine.spec.ts

      - name: Mosaic DB integration tests (13 tests — must actually run, not skip)
        env:
          MOSAIC_TEST_DATABASE_URL: mysql://ciuser:ciuserpass@127.0.0.1:3306/mosaic_ci_test
        run: npx jest src/mosaic/mosaic.service.spec.ts --json --outputFile=mosaic-db-results.json

      - name: Verify the 13 DB tests were not silently skipped
        run: |
          node -e "
            const r = require('./mosaic-db-results.json');
            const results = r.testResults[0].assertionResults;
            const passed = results.filter(t => t.status === 'passed').length;
            const skipped = results.filter(t => t.status === 'pending' || t.status === 'skipped').length;
            console.log('DB integration tests -> total: ' + results.length + ', passed: ' + passed + ', skipped: ' + skipped);
            if (skipped > 0) { console.error('FAIL: tests were skipped — MOSAIC_TEST_DATABASE_URL was likely missing or the DB was unreachable.'); process.exit(1); }
            if (passed !== 13) { console.error('FAIL: expected exactly 13 passed tests, got ' + passed); process.exit(1); }
            console.log('OK: all 13 DB integration tests executed and passed.');
          "
